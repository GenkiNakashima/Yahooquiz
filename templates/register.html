<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規登録 — JAIJAI</title>
<link rel="icon" type="image/png" href="/static/images/aiquiz-favicon.png">
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>

<div class="bg-letters" aria-hidden="true">
  <span class="bg-letter" style="font-size:300px;top:-60px;left:-40px;transform:rotate(-10deg)">J</span>
  <span class="bg-letter" style="font-size:200px;top:200px;left:-30px;transform:rotate(5deg)">A</span>
  <span class="bg-letter" style="font-size:280px;top:400px;left:-50px;transform:rotate(-4deg)">I</span>
  <span class="bg-letter" style="font-size:320px;top:-40px;right:-60px;transform:rotate(8deg)">J</span>
  <span class="bg-letter" style="font-size:180px;top:300px;right:-20px;transform:rotate(-6deg)">A</span>
  <span class="bg-letter" style="font-size:260px;top:550px;right:-40px;transform:rotate(4deg)">I</span>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="auth-title">新規登録</div>
    <div class="auth-subtitle">Create your account</div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="email">メールアドレス</label>
        <input class="form-input" type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">パスワード</label>
        <input class="form-input" type="password" id="password" name="password" required minlength="8" placeholder="••••••••">
        <div class="form-hint">8文字以上、英字と数字を含む</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="display_name">表示名（オプション）</label>
        <input class="form-input" type="text" id="display_name" name="display_name" maxlength="50" placeholder="あなたのニックネーム">
      </div>
      <button type="submit" class="submit-btn">登録する</button>
      <div class="msg-error" id="error"></div>
      <div class="msg-success" id="success"></div>
    </form>

    <div class="auth-links">
      <a href="/login" class="auth-link">すでにアカウントをお持ちの方はこちら →</a>
      <a href="/" class="auth-link">トップページに戻る</a>
    </div>
  </div>
</div>

<script src="/static/javascript/api.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const display_name = document.getElementById('display_name').value;
  const errorDiv = document.getElementById('error');
  const successDiv = document.getElementById('success');
  errorDiv.style.display = 'none';
  successDiv.style.display = 'none';

  if (password.length < 8) {
    errorDiv.textContent = 'パスワードは8文字以上必要です';
    errorDiv.style.display = 'block'; return;
  }
  if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
    errorDiv.textContent = 'パスワードには英字と数字の両方を含める必要があります';
    errorDiv.style.display = 'block'; return;
  }

  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, display_name: display_name || null })
    });
    const data = await r.json();
    if (r.ok) {
      successDiv.textContent = '登録成功！ログインページに移動します...';
      successDiv.style.display = 'block';
      setTimeout(() => window.location.href = '/login', 1800);
    } else {
      errorDiv.textContent = data.error || '登録に失敗しました';
      errorDiv.style.display = 'block';
    }
  } catch {
    errorDiv.textContent = 'ネットワークエラーが発生しました';
    errorDiv.style.display = 'block';
  }
});
</script>
</body>
</html>
