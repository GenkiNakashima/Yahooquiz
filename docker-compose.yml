services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Firestore（Application Default Credentials で認証）
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT を .env.docker に設定してください}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/adc.json
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - CEREBRAS_BASE_URL=${CEREBRAS_BASE_URL:-https://api.cerebras.ai/v1}
      - CEREBRAS_MODEL=${CEREBRAS_MODEL:-qwen-3.8-27b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODELS=${OPENROUTER_MODELS:-}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - PORT=8080
    volumes:
      # 手元の認証情報（gcloud auth application-default login で作成）を読み取り専用でマウント
      - ${GOOGLE_ADC_FILE:-~/.config/gcloud/application_default_credentials.json}:/secrets/adc.json:ro
