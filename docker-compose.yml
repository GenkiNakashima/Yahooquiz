services:
  # Firestore エミュレーター（ローカルでは本番の Firestore に接続しない）。データはコンテナを止めると消える
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8085
    # ホストには公開しない（手元で別のエミュレーターを 8085 で動かしていても衝突しない）。アプリからは firestore:8085 で接続する
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      firestore:
        condition: service_healthy
    environment:
      # Firestore はエミュレーターを使う（"demo-" で始まるプロジェクト ID は実在するプロジェクトに対応しない）
      - FIRESTORE_EMULATOR_HOST=firestore:8085
      - GOOGLE_CLOUD_PROJECT=demo-yahooquiz
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_MODELS=${GROQ_MODELS:-openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODELS=${OPENROUTER_MODELS:-}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - PORT=8080
