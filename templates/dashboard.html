<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダッシュボード — JAIJAI</title>
<link rel="icon" type="image/png" href="/static/images/aiquiz-favicon.png">
<link rel="stylesheet" href="/static/css/theme.css">
<style>
  /* ── Header card ── */
  .header-card {
    background: var(--glass-dark);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-light); border-radius: 2px;
    padding: 40px 48px;
    display: flex; align-items: center; justify-content: space-between; gap: 32px;
    margin-bottom: 24px; position: relative; overflow: hidden;
    animation: fadeUp 0.8s var(--ease) both;
  }
  .header-card::before {
    content: ''; position: absolute;
    bottom: 0; left: 48px; right: 48px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }
  .user-name {
    font-family: var(--font-display);
    font-size: 42px; font-weight: 500; letter-spacing: 0.04em;
    color: var(--off-white); line-height: 1; margin-bottom: 8px;
  }
  .user-email {
    font-size: 11px; font-weight: 200; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(245,242,236,0.4); margin-bottom: 16px;
  }
  .user-points-row {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 300; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gold-light);
  }
  .user-points-row .pt-val {
    font-family: var(--font-display); font-size: 22px; font-weight: 400;
    letter-spacing: 0.02em; color: var(--gold-light);
  }
  .pt-divider { width: 20px; height: 1px; background: var(--gold); opacity: 0.5; display: inline-block; }

  /* nav inside header card */
  .header-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .header-nav .nav-btn { color: rgba(245,242,236,0.55); }
  .header-nav .nav-btn:hover { color: var(--off-white); border-color: var(--border-light); }
  .header-nav .nav-btn::after { background: var(--gold-light); }
  .header-nav .nav-btn.logout {
    color: rgba(184,100,100,0.7); margin-left: 12px; border-color: rgba(139,32,32,0.2);
  }
  .header-nav .nav-btn.logout:hover { color: #C97070; border-color: rgba(139,32,32,0.4); background: rgba(139,32,32,0.08); }
  .header-nav .nav-btn.logout::after { background: #8B2020; }

  /* ── Dashboard grid ── */
  .dash-grid {
    display: grid;
    grid-template-columns: 280px 1fr 1fr;
    gap: 20px; align-items: start;
  }
  .panel:nth-child(1) { animation-delay: 0.1s; }
  .panel:nth-child(2) { animation-delay: 0.2s; }
  .panel:nth-child(3) { animation-delay: 0.3s; }

  /* ── Icons grid ── */
  .icons-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
    gap: 14px;
  }
  .icon-item {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: default; transition: transform 0.3s var(--ease);
  }
  .icon-item:hover { transform: translateY(-2px); }
  .icon-frame {
    width: 54px; height: 54px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    background: rgba(184,150,46,0.04); font-size: 24px;
  }
  .icon-label {
    font-size: 9px; font-weight: 300; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(26,26,24,0.4); text-align: center;
  }

  /* ── Match rows ── */
  .match-list { display: flex; flex-direction: column; }
  .match-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 0 15px 16px; border-bottom: 1px solid rgba(26,26,24,0.06);
    gap: 16px; position: relative;
    opacity: 0; transform: translateX(-8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .match-row:last-child { border-bottom: none; }
  .match-row::before {
    content: ''; position: absolute; left: 0; width: 2px; height: 0;
    top: 50%; transform: translateY(-50%);
    transition: height 0.3s var(--ease);
  }
  .match-row.loss::before { background: var(--red-soft); }
  .match-row.win::before  { background: var(--green-soft); }
  .match-row:hover::before { height: 65%; }
  .match-result {
    font-family: var(--font-display); font-size: 15px; font-weight: 400;
    letter-spacing: 0.06em; margin-bottom: 3px;
  }
  .match-row.loss .match-result { color: #8B3030; }
  .match-row.win  .match-result { color: #1A5A2E; }
  .match-date {
    font-size: 10px; font-weight: 200; letter-spacing: 0.14em; color: rgba(26,26,24,0.4);
  }
  .match-score {
    font-size: 11px; font-weight: 300; letter-spacing: 0.14em;
    color: rgba(26,26,24,0.5); white-space: nowrap;
  }
  .score-num { font-family: var(--font-display); font-size: 17px; font-weight: 400; color: var(--charcoal); margin-left: 4px; }

  /* ── Point rows ── */
  .point-list { display: flex; flex-direction: column; }
  .point-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 17px 0; border-bottom: 1px solid rgba(26,26,24,0.06); gap: 16px;
    opacity: 0; transform: translateX(-8px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .point-row:last-child { border-bottom: none; }
  .point-label {
    font-family: var(--font-display); font-size: 15px; font-weight: 400;
    letter-spacing: 0.05em; color: var(--charcoal); margin-bottom: 3px;
  }
  .point-date { font-size: 10px; font-weight: 200; letter-spacing: 0.14em; color: rgba(26,26,24,0.4); }
  .point-amount {
    font-family: var(--font-display); font-size: 19px; font-weight: 300;
    letter-spacing: 0.02em; white-space: nowrap;
  }
  .point-amount.positive { color: #1A5A2E; }
  .point-amount.negative { color: #8B3030; }

  .loading-text {
    font-size: 10px; font-weight: 200; letter-spacing: 0.2em;
    text-transform: uppercase; color: rgba(26,26,24,0.35); padding: 20px 0;
  }

  @media (max-width: 900px) {
    .dash-grid { grid-template-columns: 1fr 1fr; }
    .dash-grid .panel:first-child { grid-column: 1 / -1; }
    .header-card { flex-direction: column; align-items: flex-start; }
  }
  @media (max-width: 600px) {
    .dash-grid { grid-template-columns: 1fr; }
    .header-card { padding: 28px 24px; }
    .user-name { font-size: 32px; }
    .panel-body { padding: 16px 20px 24px; }
    .panel-header { padding: 18px 20px 14px; }
    .header-nav { flex-wrap: wrap; }
  }

  /* ハンバーガーメニューボタン */
  .hamburger-btn {
    display: none; /* PCでは非表示 */
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    flex-direction: column;
    gap: 4px;
    position: relative;
    z-index: 11;
  }
  .hamburger-line {
    width: 20px;
    height: 2px;
    background: var(--charcoal);
    transition: all 0.3s var(--ease);
    transform-origin: center;
  }

  /* スマホ時のハンバーガーメニュー開閉アニメーション */
  .hamburger-btn.active .hamburger-line:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
  }
  .hamburger-btn.active .hamburger-line:nth-child(2) {
    opacity: 0;
  }
  .hamburger-btn.active .hamburger-line:nth-child(3) {
    transform: rotate(-45deg) translate(7px, -6px);
  }

  /* スマホ時のナビゲーション表示制御 */
  @media (max-width: 600px) {
    .hamburger-btn {
      display: flex; /* スマホで表示 */
      background: #ffffff;
      border-radius: 4px;
    }
    .header-nav {
      position: fixed;
      top: 0;
      right: -100%; /* 初期状態で画面外 */
      width: 280px;
      height: 100vh;
      background: var(--glass-dark);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-light);
      flex-direction: column;
      align-items: flex-start;
      padding: 80px 24px 24px;
      gap: 16px;
      transition: right 0.3s var(--ease);
      z-index: 10;
    }
    .header-nav.open {
      right: 0; /* 開いた状態 */
    }
    .header-nav .nav-btn {
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      border-radius: 4px;
    }
    .header-nav .nav-btn:hover {
      background: rgba(245,242,236,0.05);
    }
  }
</style>
</head>
<body>

<div class="bg-letters" aria-hidden="true">
  <span class="bg-letter" style="font-size:280px;top:-40px;left:-30px;transform:rotate(-8deg)">A</span>
  <span class="bg-letter" style="font-size:180px;top:60px;left:20px;transform:rotate(-5deg)">B</span>
  <span class="bg-letter" style="font-size:320px;top:200px;left:-60px;transform:rotate(3deg)">C</span>
  <span class="bg-letter" style="font-size:220px;top:500px;left:-20px;transform:rotate(-6deg)">D</span>
  <span class="bg-letter" style="font-size:260px;top:700px;left:-40px;transform:rotate(4deg)">N</span>
  <span class="bg-letter" style="font-size:300px;top:-20px;right:-50px;transform:rotate(6deg)">M</span>
  <span class="bg-letter" style="font-size:200px;top:300px;right:-20px;transform:rotate(-4deg)">K</span>
  <span class="bg-letter" style="font-size:260px;top:600px;right:-40px;transform:rotate(5deg)">Z</span>
</div>

<div class="page">
  <!-- Header card -->
  <div class="header-card">
    <div>
      <div class="user-name" id="displayName">—</div>
      <div class="user-email" id="email"></div>
      <div class="user-points-row">
        <span class="pt-divider"></span>
        <span>ポイント</span>
        <span class="pt-val" id="points">0</span>
        <span style="font-size:9px;letter-spacing:0.1em;color:rgba(212,175,90,0.5)">PT</span>
      </div>
    </div>
    <nav class="header-nav">
      <a href="/" class="nav-btn">ゲーム</a>
      <a href="/shop" class="nav-btn">ショップ</a>
      <a href="/leaderboard" class="nav-btn">ランキング</a>
      <button class="nav-btn logout" onclick="logout()">ログアウト</button>
    </nav>
    <!-- ハンバーガーメニューボタン（スマホ時のみ表示） -->
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="メニューを開く">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>

  <!-- Grid -->
  <div class="dash-grid">
    <!-- 所有アイコン -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">所有アイコン</div>
      </div>
      <div class="panel-body">
        <div id="iconsList" class="icons-grid">
          <div class="loading-text">読み込み中...</div>
        </div>
      </div>
    </div>

    <!-- 最近の対戦履歴 -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">最近の対戦履歴</div>
      </div>
      <div class="panel-body" style="padding-left:48px">
        <div id="matchHistory" class="match-list">
          <div class="loading-text">読み込み中...</div>
        </div>
      </div>
    </div>

    <!-- ポイント履歴 -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">ポイント履歴</div>
      </div>
      <div class="panel-body">
        <div id="transactionHistory" class="point-list">
          <div class="loading-text">読み込み中...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/javascript/api.js"></script>
<script>
const accessToken = localStorage.getItem('access_token');
if (!accessToken) window.location.href = '/login';

async function loadUserData() {
  try {
    const r = await fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${accessToken}` } });
    if (r.ok) {
      const user = await r.json();
      document.getElementById('displayName').textContent = user.display_name || 'ゲスト';
      document.getElementById('email').textContent = user.email;
      document.getElementById('points').textContent = user.points.toLocaleString();
      loadIcons(user.icons);
    } else if (r.status === 401) {
      localStorage.removeItem('access_token');
      window.location.href = '/login';
    }
  } catch (e) { console.error(e); }
}

function loadIcons(icons) {
  const el = document.getElementById('iconsList');
  if (icons && icons.length > 0) {
    el.innerHTML = icons.map(icon => `
      <div class="icon-item">
        <div class="icon-frame">🏆</div>
        <div class="icon-label">${icon.name.replace(/_/g,' ')}</div>
      </div>
    `).join('');
  } else {
    el.innerHTML = '<div class="empty-state">アイコンなし</div>';
  }
}

async function loadMatchHistory() {
  try {
    const r = await fetch('/api/users/me/matches', { headers: { 'Authorization': `Bearer ${accessToken}` } });
    if (r.ok) {
      const data = await r.json();
      const el = document.getElementById('matchHistory');
      if (data.matches && data.matches.length > 0) {
        el.innerHTML = data.matches.map(m => `
          <div class="match-row ${m.is_winner ? 'win' : 'loss'}">
            <div>
              <div class="match-result">${m.is_winner ? '勝利' : '敗北'}</div>
              <div class="match-date">${new Date(m.created_at).toLocaleDateString('ja-JP').replace(/\//g,' / ')}</div>
            </div>
            <div class="match-score">スコア <span class="score-num">${m.score}</span></div>
          </div>
        `).join('');
        animateRows('.match-row');
      } else {
        el.innerHTML = '<div class="empty-state">対戦履歴なし</div>';
      }
    }
  } catch (e) { console.error(e); }
}

async function loadTransactionHistory() {
  try {
    const r = await fetch('/api/users/me/transactions?limit=10', { headers: { 'Authorization': `Bearer ${accessToken}` } });
    if (r.ok) {
      const data = await r.json();
      const el = document.getElementById('transactionHistory');
      if (data.transactions && data.transactions.length > 0) {
        el.innerHTML = data.transactions.map(tx => `
          <div class="point-row">
            <div>
              <div class="point-label">${tx.type}</div>
              <div class="point-date">${new Date(tx.created_at).toLocaleDateString('ja-JP').replace(/\//g,' / ')}</div>
            </div>
            <div class="point-amount ${tx.amount > 0 ? 'positive' : 'negative'}">
              ${tx.amount > 0 ? '+' : ''}${tx.amount} pt
            </div>
          </div>
        `).join('');
        animateRows('.point-row');
      } else {
        el.innerHTML = '<div class="empty-state">履歴なし</div>';
      }
    }
  } catch (e) { console.error(e); }
}

function animateRows(selector) {
  document.querySelectorAll(selector).forEach((row, i) => {
    setTimeout(() => {
      row.style.opacity = '1';
      row.style.transform = 'translateX(0)';
    }, i * 60);
  });
}

function logout() {
  localStorage.removeItem('access_token');
  localStorage.removeItem('user');
  window.location.href = '/login';
}

loadUserData();
loadMatchHistory();
loadTransactionHistory();

// ハンバーガーメニューの開閉機能
const hamburgerBtn = document.getElementById('hamburgerBtn');
const headerNav = document.querySelector('.header-nav');

if (hamburgerBtn && headerNav) {
  hamburgerBtn.addEventListener('click', () => {
    hamburgerBtn.classList.toggle('active');
    headerNav.classList.toggle('open');
  });

  // メニュー外クリックで閉じる
  document.addEventListener('click', (e) => {
    if (!hamburgerBtn.contains(e.target) && !headerNav.contains(e.target)) {
      hamburgerBtn.classList.remove('active');
      headerNav.classList.remove('open');
    }
  });

  // メニュー項目クリックで閉じる
  headerNav.addEventListener('click', (e) => {
    if (e.target.classList.contains('nav-btn') || e.target.closest('.nav-btn')) {
      hamburgerBtn.classList.remove('active');
      headerNav.classList.remove('open');
    }
  });
}
</script>
</body>
</html>
