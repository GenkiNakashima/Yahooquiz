<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン — JAIJAI</title>
<link rel="icon" type="image/png" href="/static/images/aiquiz-favicon.png">
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>

<div class="bg-letters" aria-hidden="true">
  <span class="bg-letter" style="font-size:300px;top:-60px;left:-40px;transform:rotate(-10deg)">J</span>
  <span class="bg-letter" style="font-size:200px;top:200px;left:-30px;transform:rotate(5deg)">A</span>
  <span class="bg-letter" style="font-size:280px;top:400px;left:-50px;transform:rotate(-4deg)">I</span>
  <span class="bg-letter" style="font-size:320px;top:-40px;right:-60px;transform:rotate(8deg)">J</span>
  <span class="bg-letter" style="font-size:180px;top:300px;right:-20px;transform:rotate(-6deg)">A</span>
  <span class="bg-letter" style="font-size:260px;top:550px;right:-40px;transform:rotate(4deg)">I</span>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="auth-title">ログイン</div>
    <div class="auth-subtitle">Sign in to your account</div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">メールアドレス</label>
        <input class="form-input" type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">パスワード</label>
        <input class="form-input" type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="submit-btn">ログイン</button>
      <div class="msg-error" id="error"></div>
      <div class="msg-success" id="success"></div>
    </form>

    <div class="auth-links">
      <a href="/register" class="auth-link">アカウントをお持ちでない方はこちら →</a>
      <a href="/" class="auth-link">トップページに戻る</a>
    </div>
  </div>
</div>

<script src="/static/javascript/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('error');
  const successDiv = document.getElementById('success');
  errorDiv.style.display = 'none';
  successDiv.style.display = 'none';

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await r.json();
    if (r.ok) {
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('user', JSON.stringify(data.user));
      successDiv.textContent = 'ログイン成功！リダイレクトしています...';
      successDiv.style.display = 'block';
      setTimeout(() => window.location.href = '/dashboard', 900);
    } else {
      errorDiv.textContent = data.error || 'ログインに失敗しました';
      errorDiv.style.display = 'block';
    }
  } catch {
    errorDiv.textContent = 'ネットワークエラーが発生しました';
    errorDiv.style.display = 'block';
  }
});
</script>
</body>
</html>
